<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" data-pptx-page-role="content" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif" lang="zh-CN" viewBox="0 0 1280 720"><defs><pattern id="halftone-pink" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#FF4765" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#FF4765" fill-opacity=".3"/></pattern><pattern id="halftone-teal" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#006B7B" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#006B7B" fill-opacity=".25"/></pattern></defs><rect id="bg" width="1280" height="720" fill="#FAF6EE" data-pptx-role="background"/><g id="header-zone" data-pptx-bounds="40 25 1200 130"><rect width="280" height="30" x="60" y="30" fill="#181A24"/><text x="200" y="51" fill="#FFA800" font-family="'Courier New', monospace" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">CHAPTER 06 / GEEK SPECIAL</text><text x="60" y="105" fill="#181A24" font-size="38" font-weight="900">极客专属：计算机与 IT 程序员英语专项</text><text x="60" y="138" fill="#006B7B" font-size="18" font-weight="700">专为软件工程师、出海开发人员与计算机专业学生定制的技术护城河</text></g><g id="geek-body-zone" data-pptx-bounds="60 165 1160 515"><g id="terminal-window"><rect width="550" height="490" x="64" y="174" fill="#006B7B"/><rect width="550" height="490" x="60" y="170" fill="#181A24" stroke="#181A24" stroke-width="3"/><circle cx="85" cy="195" r="7" fill="#FF4765"/><circle cx="105" cy="195" r="7" fill="#FFA800"/><circle cx="125" cy="195" r="7" fill="#00E676"/><text x="335" y="200" fill="#94A3B8" font-family="'Courier New', monospace" font-size="13" text-anchor="middle">bash — lilinji@github: ~/English/9.扇贝英语（IT）</text><line x1="60" x2="610" y1="215" y2="215" stroke="#334155" stroke-width="2"/><g id="term-text" font-family="'Courier New', Menlo, monospace" font-size="14"><text x="85" y="248" fill="#00E676">$ git clone https://github.com/lilinji/English.git</text><text x="85" y="278" fill="#94A3B8">Cloning into &apos;English&apos;... 960+ books loaded.</text><text x="85" y="318" fill="#00E676">$ ls -la ./9.扇贝英语（IT）/</text><text x="85" y="348" fill="#FFA800">drwxr-xr-x 18 items total 18 files</text><text x="85" y="375" fill="#FAF6EE">-rw-r--r-- 计算机专业英语词汇.xls</text><text x="85" y="402" fill="#FAF6EE">-rw-r--r-- Python词汇（基础版）.xls</text><text x="85" y="429" fill="#FAF6EE">-rw-r--r-- JAVA程序员英语通关单词.xls</text><text x="85" y="456" fill="#FAF6EE">-rw-r--r-- 雅思NAWL学术词汇.txt</text><text x="85" y="500" fill="#00E676">$ python3 -c &quot;import english_vault&quot;</text><text x="85" y="530" fill="#00E676">[SUCCESS] Technical Vocab Initialized.</text><text x="85" y="558" fill="#94A3B8">// 摆脱读官方英文 API 文档与源码时的卡顿困境</text><text x="85" y="585" fill="#94A3B8">// 助力外企外包面试、出海远程协作与技术论文发表</text><text x="85" y="625" fill="#FF4765">★ Empower Your Engineering Career ★</text></g></g><g id="geek-features"><g id="geek-c1"><rect width="586" height="150" x="634" y="174" fill="#FFA800"/><rect width="586" height="150" x="630" y="170" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="220" height="32" x="655" y="192" fill="#006B7B"/><text x="765" y="214" fill="#FAF6EE" font-size="16" font-weight="900" text-anchor="middle">💻 计算机专业核心词汇</text><text x="655" y="255" fill="#181A24" font-size="17" font-weight="900">底层原理 · 操作系统 · 网络与架构</text><text x="655" y="285" fill="#475569" font-size="14">涵盖计算机体系结构、CPU 缓存、虚拟内存、TCP/IP 协议栈、并发锁等 <tspan x="655" dy="22">硬核专有名词，扫清阅读 CSAPP、Linux 内核源码等经典原版书的阻碍。</tspan></text></g><g id="geek-c2"><rect width="586" height="150" x="634" y="344" fill="#FF4765"/><rect width="586" height="150" x="630" y="340" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="220" height="32" x="655" y="362" fill="#FF4765"/><text x="765" y="384" fill="#FAF6EE" font-size="16" font-weight="900" text-anchor="middle">🐍 Python / Java 通关词汇</text><text x="655" y="425" fill="#181A24" font-size="17" font-weight="900">主流开发语言关键字 · 异常 · 框架 API</text><text x="655" y="455" fill="#475569" font-size="14">覆盖常见编程语法关键字、Exception 异常类型命名、设计模式、 <tspan x="655" dy="22">主流 Spring/Django 框架常用 API 词汇，写出地道优美的代码命名。</tspan></text></g><g id="geek-c3"><rect width="586" height="150" x="634" y="514" fill="#181A24"/><rect width="586" height="150" x="630" y="510" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="220" height="32" x="655" y="532" fill="#181A24"/><text x="765" y="554" fill="#FFA800" font-size="16" font-weight="900" text-anchor="middle">📑 NAWL 国际学术论文词汇</text><text x="655" y="595" fill="#181A24" font-size="17" font-weight="900">New Academic Word List (学术通用词表)</text><text x="655" y="625" fill="#475569" font-size="14">针对撰写 arXiv 论文、研读 AI/大模型顶会技术白皮书（NeurIPS/ICLR） <tspan x="655" dy="22">高频学术词汇表，帮助工程师无障碍汲取全球前沿技术文献。</tspan></text></g></g></g></svg>