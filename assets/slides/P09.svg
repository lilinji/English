<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" data-pptx-page-role="content" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif" lang="zh-CN" viewBox="0 0 1280 720"><defs><pattern id="halftone-pink" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#FF4765" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#FF4765" fill-opacity=".3"/></pattern><pattern id="halftone-teal" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#006B7B" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#006B7B" fill-opacity=".25"/></pattern></defs><rect id="bg" width="1280" height="720" fill="#FAF6EE" data-pptx-role="background"/><g id="header-zone" data-pptx-bounds="40 25 1200 130"><rect width="280" height="30" x="60" y="30" fill="#006B7B"/><text x="200" y="51" fill="#FAF6EE" font-family="'Courier New', monospace" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">CHAPTER 08 / ROADMAP</text><text x="60" y="105" fill="#181A24" font-size="38" font-weight="900">项目演进路线图与全球社区协作网络</text><text x="60" y="138" fill="#FF4765" font-size="18" font-weight="700">人人为我，我为人人：集全球学习者智慧，持续打磨卓越词汇资产</text></g><g id="roadmap-body-zone" data-pptx-bounds="60 165 1160 515"><g id="roadmap-left"><rect width="560" height="490" x="64" y="174" fill="#FF4765"/><rect width="560" height="490" x="60" y="170" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="260" height="38" x="90" y="195" fill="#006B7B"/><text x="220" y="221" fill="#FAF6EE" font-size="18" font-weight="900" text-anchor="middle">🗺️ 项目路线图 (Roadmap)</text><g id="rm-done-1"><rect width="26" height="26" x="90" y="255" fill="#006B7B"/><text x="103" y="274" fill="#FAF6EE" font-size="16" font-weight="900" text-anchor="middle">✓</text><text x="130" y="274" fill="#181A24" font-size="17" font-weight="900">完成 960+ 词书全景盘点与分类索引搭建</text></g><g id="rm-done-2"><rect width="26" height="26" x="90" y="305" fill="#006B7B"/><text x="103" y="324" fill="#FAF6EE" font-size="16" font-weight="900" text-anchor="middle">✓</text><text x="130" y="324" fill="#181A24" font-size="17" font-weight="900">深度集成新概念全套词库与 108 篇讲义合订本</text></g><g id="rm-done-3"><rect width="26" height="26" x="90" y="355" fill="#006B7B"/><text x="103" y="374" fill="#FAF6EE" font-size="16" font-weight="900" text-anchor="middle">✓</text><text x="130" y="374" fill="#181A24" font-size="17" font-weight="900">建立大厂标准多语言文档体系 (中/英/日/西)</text></g><line x1="90" x2="580" y1="400" y2="400" stroke="#CBD5E1" stroke-dasharray="6 4" stroke-width="2"/><g id="rm-fut-1"><rect width="26" height="26" x="90" y="420" fill="#FFA800" stroke="#181A24" stroke-width="2"/><text x="103" y="439" fill="#181A24" font-size="16" font-weight="900" text-anchor="middle">→</text><text x="130" y="439" fill="#181A24" font-size="17" font-weight="900">自动化构建工具：一键批量转 Anki .apkg 卡牌包</text><text x="130" y="465" fill="#64748B" font-size="14">开发开源 Python 编译脚本，免去手动导出 CSV 的繁琐</text></g><g id="rm-fut-2"><rect width="26" height="26" x="90" y="500" fill="#FFA800" stroke="#181A24" stroke-width="2"/><text x="103" y="519" fill="#181A24" font-size="16" font-weight="900" text-anchor="middle">→</text><text x="130" y="519" fill="#181A24" font-size="17" font-weight="900">AI 词库精校工程：大模型与社区协作纠偏</text><text x="130" y="545" fill="#64748B" font-size="14">利用大语言模型全面审查历史词库中生僻义与缺失音标</text></g><g id="rm-fut-3"><rect width="26" height="26" x="90" y="580" fill="#FFA800" stroke="#181A24" stroke-width="2"/><text x="103" y="599" fill="#181A24" font-size="16" font-weight="900" text-anchor="middle">→</text><text x="130" y="599" fill="#181A24" font-size="17" font-weight="900">Web 在线词典检索器：GitHub Pages 纯前端工具</text><text x="130" y="625" fill="#64748B" font-size="14">免下载免安装，直接在浏览器中即时检索 960+ 词书收录情况</text></g></g><g id="community-right"><rect width="566" height="490" x="654" y="174" fill="#181A24"/><rect width="566" height="490" x="650" y="170" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="280" height="38" x="680" y="195" fill="#FF4765"/><text x="820" y="221" fill="#FAF6EE" font-size="18" font-weight="900" text-anchor="middle">🤝 极简 5 步参与社区贡献</text><g fill="#181A24" font-size="15"><g id="step-1"><circle cx="705" cy="275" r="16" fill="#181A24"/><text x="705" y="281" fill="#FAF6EE" font-weight="900" text-anchor="middle">1</text><text x="735" y="272" font-weight="900">Fork 本仓库到个人 GitHub 账号</text><text x="735" y="295" fill="#64748B" font-family="'Courier New', monospace">github.com/lilinji/English ➔ Fork</text></g><g id="step-2"><circle cx="705" cy="350" r="16" fill="#181A24"/><text x="705" y="356" fill="#FAF6EE" font-weight="900" text-anchor="middle">2</text><text x="735" y="347" font-weight="900">新建特性分支进行编辑与勘误</text><text x="735" y="370" fill="#64748B" font-family="'Courier New', monospace">git checkout -b feature/fix-phonetics</text></g><g id="step-3"><circle cx="705" cy="425" r="16" fill="#181A24"/><text x="705" y="431" fill="#FAF6EE" font-weight="900" text-anchor="middle">3</text><text x="735" y="422" font-weight="900">提交符合规范的清晰 Commit</text><text x="735" y="445" fill="#64748B" font-family="'Courier New', monospace">git commit -m &quot;docs: 纠正四级词库音标&quot;</text></g><g id="step-4"><circle cx="705" cy="500" r="16" fill="#181A24"/><text x="705" y="506" fill="#FAF6EE" font-weight="900" text-anchor="middle">4</text><text x="735" y="497" font-weight="900">发起 Pull Request 等待审核合并</text><text x="735" y="520" fill="#64748B">我们在验证后第一时间合并并计入贡献者名录</text></g><g id="step-5"><circle cx="705" cy="575" r="16" fill="#181A24"/><text x="705" y="581" fill="#FAF6EE" font-weight="900" text-anchor="middle">5</text><text x="735" y="572" font-weight="900">发现问题亦可在 GitHub Issues 随时反馈</text><text x="735" y="595" fill="#64748B">共同构建全球最严谨的开源英语词汇标准</text></g></g></g></g></svg>