<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" data-pptx-page-role="content" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif" lang="zh-CN" viewBox="0 0 1280 720"><defs><pattern id="halftone-pink" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#FF4765" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#FF4765" fill-opacity=".3"/></pattern><pattern id="halftone-teal" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#006B7B" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#006B7B" fill-opacity=".25"/></pattern></defs><rect id="bg" width="1280" height="720" fill="#FAF6EE" data-pptx-role="background"/><g id="header-zone" data-pptx-bounds="40 25 1200 130"><rect width="280" height="30" x="60" y="30" fill="#FF4765"/><text x="200" y="51" fill="#FAF6EE" font-family="'Courier New', monospace" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">CHAPTER 05 / TREASURE ASSET</text><text x="60" y="105" fill="#181A24" font-size="38" font-weight="900">镇馆之宝：新概念英语全套数字化研习套装</text><text x="60" y="138" fill="#006B7B" font-size="18" font-weight="700">全套生词库 + 108 篇名师讲义合订本与课文精析（Docx / 47.4 MB PDF）</text></g><g id="new-concept-cards-zone" data-pptx-bounds="60 165 1160 515"><g id="nc-card-1"><rect width="360" height="490" x="64" y="174" fill="#006B7B"/><rect width="360" height="490" x="60" y="170" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="360" height="60" x="60" y="170" fill="#006B7B"/><text x="240" y="208" fill="#FAF6EE" font-size="22" font-weight="900" text-anchor="middle">📘 经典 + 青少全套词库</text><rect width="310" height="40" x="85" y="250" fill="#E1F2F5" stroke="#006B7B" stroke-width="1.5"/><text x="240" y="276" fill="#006B7B" font-size="17" font-weight="900" text-anchor="middle">16 本完整 Excel 数字化生词表</text><text x="85" y="325" fill="#181A24" font-size="17" font-weight="900">1. 经典版（全 4 册）：</text><text x="85" y="355" fill="#475569" font-size="15">• 第一册：英语初阶 (First Things First)</text><text x="85" y="380" fill="#475569" font-size="15">• 第二册：实践与进步 (Practice &amp; Progress)</text><text x="85" y="405" fill="#475569" font-size="15">• 第三册：培养技能 (Developing Skills)</text><text x="85" y="430" fill="#475569" font-size="15">• 第四册：流利英语 (Fluency in English)</text><line x1="85" x2="395" y1="455" y2="455" stroke="#CBD5E1" stroke-dasharray="4 4" stroke-width="1"/><text x="85" y="485" fill="#181A24" font-size="17" font-weight="900">2. 青少版全套 (Junior)：</text><text x="85" y="515" fill="#475569" font-size="15">• 入门级 Starter A / Starter B</text><text x="85" y="540" fill="#475569" font-size="15">• 1A/1B ~ 5A/5B 全套 12 册词表</text><text x="85" y="565" fill="#475569" font-size="15">• 完美契合青少阶梯词汇量扩充</text><rect width="310" height="45" x="85" y="595" fill="#FAF6EE" stroke="#181A24" stroke-width="1.5"/><text x="240" y="623" fill="#181A24" font-size="14" font-weight="700" text-anchor="middle">规范音标 · 权威词义 · 精确校对</text></g><g id="nc-card-2"><rect width="360" height="490" x="464" y="174" fill="#FF4765"/><rect width="360" height="490" x="460" y="170" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="360" height="60" x="460" y="170" fill="#FF4765"/><text x="640" y="208" fill="#FAF6EE" font-size="22" font-weight="900" text-anchor="middle">📙 第三册 60 篇名师讲义</text><rect width="310" height="40" x="485" y="250" fill="#FFE8EC" stroke="#FF4765" stroke-width="1.5"/><text x="640" y="276" fill="#FF4765" font-size="17" font-weight="900" text-anchor="middle">Lesson 01 ~ Lesson 60 独立讲义</text><text x="485" y="325" fill="#181A24" font-size="17" font-weight="900">核心赋能体系：</text><text x="485" y="355" fill="#475569" font-size="15">• 课文背景文化与原著文学典故</text><text x="485" y="380" fill="#475569" font-size="15">• 核心词汇用法辨析与搭配拓展</text><text x="485" y="405" fill="#475569" font-size="15">• 关键句型结构拆解与语法专题</text><text x="485" y="430" fill="#475569" font-size="15">• 课后经典练习答案深度精析</text><line x1="485" x2="795" y1="455" y2="455" stroke="#CBD5E1" stroke-dasharray="4 4" stroke-width="1"/><rect width="310" height="95" x="485" y="475" fill="#FFF4D9" stroke="#FFA800" stroke-width="2"/><text x="500" y="505" fill="#181A24" font-size="16" font-weight="900">⚡ 附赠 47.4 MB 完整精析合订本：</text><text x="500" y="533" fill="#475569" font-size="14">全 60 篇合并为高清排版 PDF， <tspan x="500" dy="22">支持平板手写批注与离线随时研读。</tspan></text><rect width="310" height="45" x="485" y="595" fill="#FAF6EE" stroke="#181A24" stroke-width="1.5"/><text x="640" y="623" fill="#FF4765" font-size="14" font-weight="700" text-anchor="middle">告别死记硬背 · 语境中建立长效记忆</text></g><g id="nc-card-3"><rect width="360" height="490" x="864" y="174" fill="#FFA800"/><rect width="360" height="490" x="860" y="170" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="360" height="60" x="860" y="170" fill="#FFA800"/><text x="1040" y="208" fill="#181A24" font-size="22" font-weight="900" text-anchor="middle">📗 第四册 48 篇高阶精析</text><rect width="310" height="40" x="885" y="250" fill="#FFF4D9" stroke="#FFA800" stroke-width="1.5"/><text x="1040" y="276" fill="#181A24" font-size="17" font-weight="900" text-anchor="middle">Lesson 01 ~ Lesson 48 完整讲义</text><text x="885" y="325" fill="#181A24" font-size="17" font-weight="900">学术高阶与英美文风：</text><text x="885" y="355" fill="#475569" font-size="15">• 原汁原味英美大师级散文文风赏析</text><text x="885" y="380" fill="#475569" font-size="15">• 极复杂长难句与多重从句逻辑切分</text><text x="885" y="405" fill="#475569" font-size="15">• 高阶学术仿写与严谨论辩表达</text><text x="885" y="430" fill="#475569" font-size="15">• 考博/GRE 级高雅辞藻与哲思意境</text><line x1="885" x2="1195" y1="455" y2="455" stroke="#CBD5E1" stroke-dasharray="4 4" stroke-width="1"/><rect width="310" height="95" x="885" y="475" fill="#FAF6EE" stroke="#181A24" stroke-width="2"/><text x="900" y="505" fill="#181A24" font-size="16" font-weight="900">💡 适合研读人群：</text><text x="900" y="533" fill="#475569" font-size="14">英语专业高年级学生、考博学者、 <tspan x="900" dy="22">高级翻译与海外学术论文写作者。</tspan></text><rect width="310" height="45" x="885" y="595" fill="#FAF6EE" stroke="#181A24" stroke-width="1.5"/><text x="1040" y="623" fill="#181A24" font-size="14" font-weight="700" text-anchor="middle">母语者思维 · 英文写作终极殿堂</text></g></g></svg>