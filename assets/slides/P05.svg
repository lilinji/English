<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" data-pptx-page-role="content" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif" lang="zh-CN" viewBox="0 0 1280 720"><defs><pattern id="halftone-pink" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#FF4765" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#FF4765" fill-opacity=".3"/></pattern><pattern id="halftone-teal" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#006B7B" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#006B7B" fill-opacity=".25"/></pattern></defs><rect id="bg" width="1280" height="720" fill="#FAF6EE" data-pptx-role="background"/><g id="header-zone" data-pptx-bounds="40 25 1200 130"><rect width="280" height="30" x="60" y="30" fill="#006B7B"/><text x="200" y="51" fill="#FAF6EE" font-family="'Courier New', monospace" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">CHAPTER 04 / ABROAD EXAMS</text><text x="60" y="105" fill="#181A24" font-size="38" font-weight="900">出国双雄：雅思 7.0+ 战术图谱与托福跨学科</text><text x="60" y="138" fill="#FF4765" font-size="18" font-weight="700">专为“屠鸭”与托福网考 (iBT) 定制，按认知心理学与真实真题高频场景深度归类</text></g><g id="abroad-body-zone" data-pptx-bounds="60 165 1160 515"><g id="ielts-section"><rect width="600" height="490" x="64" y="174" fill="#FF4765"/><rect width="600" height="490" x="60" y="170" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="280" height="38" x="90" y="195" fill="#006B7B"/><text x="230" y="221" fill="#FAF6EE" font-size="18" font-weight="900" text-anchor="middle">🎓 雅思科学备考 4 步通关流</text><g id="ielts-step-1"><rect width="540" height="68" x="90" y="250" fill="#E1F2F5" stroke="#006B7B" stroke-width="2"/><rect width="60" height="68" x="90" y="250" fill="#006B7B"/><text x="120" y="292" fill="#FAF6EE" font-family="Impact, sans-serif" font-size="22" font-weight="900" text-anchor="middle">01</text><text x="170" y="280" fill="#181A24" font-size="17" font-weight="900">夯实基础：雅思标准词汇 3800</text><text x="170" y="304" fill="#475569" font-size="14">扫盲低中阶词汇死角，建立最基础的听说读写词根认知</text></g><g id="ielts-step-2"><rect width="540" height="68" x="90" y="330" fill="#FFF4D9" stroke="#FFA800" stroke-width="2"/><rect width="60" height="68" x="90" y="330" fill="#FFA800"/><text x="120" y="372" fill="#181A24" font-family="Impact, sans-serif" font-size="22" font-weight="900" text-anchor="middle">02</text><text x="170" y="360" fill="#181A24" font-size="17" font-weight="900">听写极速反应：王陆 807 核心词 (听/说/读/写)</text><text x="170" y="384" fill="#475569" font-size="14">考鸭人手必备，精准击破听力反应盲区与高频拼写易错点</text></g><g id="ielts-step-3"><rect width="540" height="68" x="90" y="410" fill="#FFE8EC" stroke="#FF4765" stroke-width="2"/><rect width="60" height="68" x="90" y="410" fill="#FF4765"/><text x="120" y="452" fill="#FAF6EE" font-family="Impact, sans-serif" font-size="22" font-weight="900" text-anchor="middle">03</text><text x="170" y="440" fill="#181A24" font-size="17" font-weight="900">场景拓展：雅思词汇词以类记 (主题式记忆)</text><text x="170" y="464" fill="#475569" font-size="14">针对口语与大作文 Topic 分类背诵，形成高分语块联想网</text></g><g id="ielts-step-4"><rect width="540" height="68" x="90" y="490" fill="#FAF6EE" stroke="#181A24" stroke-width="2"/><rect width="60" height="68" x="90" y="490" fill="#181A24"/><text x="120" y="532" fill="#FAF6EE" font-family="Impact, sans-serif" font-size="22" font-weight="900" text-anchor="middle">04</text><text x="170" y="520" fill="#181A24" font-size="17" font-weight="900">真题实战：剑桥雅思真词汇 (剑 4-17 精选)</text><text x="170" y="544" fill="#475569" font-size="14">剑桥官方真题高频原汁原味复现，考前 1-2 周终极扫雷</text></g><rect width="540" height="52" x="90" y="580" fill="#006B7B" stroke="#181A24" stroke-width="2"/><text x="360" y="613" fill="#FFA800" font-size="22" font-weight="900" text-anchor="middle">🎯 终极目标：IELTS 7.0+ / 7.5+ 稳操胜券</text></g><g id="toefl-section"><rect width="536" height="490" x="684" y="174" fill="#181A24"/><rect width="536" height="490" x="680" y="170" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="280" height="38" x="710" y="195" fill="#FF4765"/><text x="850" y="221" fill="#FAF6EE" font-size="18" font-weight="900" text-anchor="middle">✈️ 托福跨学科学术背景矩阵</text><g id="toefl-item-1"><rect width="476" height="95" x="710" y="250" fill="#FFE8EC" stroke="#FF4765" stroke-width="2"/><text x="730" y="280" fill="#181A24" font-size="18" font-weight="900">📘 TOEFL 词汇词以类记</text><text x="730" y="306" fill="#475569" font-size="14">涵盖托福阅读/听力必考跨学科场景：生物演化、地质板块、 <tspan x="730" dy="22">天文宇宙、文艺复兴历史、心理学实验等学术高频背景词。</tspan></text></g><g id="toefl-item-2"><rect width="476" height="95" x="710" y="360" fill="#FFF4D9" stroke="#FFA800" stroke-width="2"/><text x="730" y="390" fill="#181A24" font-size="18" font-weight="900">⚡ 托福核心词汇 21 天突破</text><text x="730" y="416" fill="#475569" font-size="14">李笑来经典 21 天突破法，精选反复出现的关键学术动词、 <tspan x="730" dy="22">论证形容词与逻辑副词，快速拉起学术文本阅读流畅度。</tspan></text></g><g id="toefl-item-3"><rect width="476" height="95" x="710" y="470" fill="#E1F2F5" stroke="#006B7B" stroke-width="2"/><text x="730" y="500" fill="#181A24" font-size="18" font-weight="900">🔄 托福词汇乱序版 (强化第一反射)</text><text x="730" y="526" fill="#475569" font-size="14">彻底避免字母排序带来的惰性背诵假象；听力考场上无序抓词， <tspan x="730" dy="22">强化听到音标与释义毫秒级反应的能力。</tspan></text></g><rect width="476" height="52" x="710" y="580" fill="#181A24" stroke="#181A24" stroke-width="2"/><text x="948" y="613" fill="#FAF6EE" font-size="18" font-weight="900" text-anchor="middle">🚀 托福 iBT 105+ 学术破局硬核武器</text></g></g></svg>