<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" data-pptx-page-role="content" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif" lang="zh-CN" viewBox="0 0 1280 720"><defs><pattern id="halftone-pink" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#FF4765" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#FF4765" fill-opacity=".3"/></pattern><pattern id="halftone-teal" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#006B7B" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#006B7B" fill-opacity=".25"/></pattern></defs><rect id="bg" width="1280" height="720" fill="#FAF6EE" data-pptx-role="background"/><g id="header-zone" data-pptx-bounds="40 25 1200 130"><rect width="280" height="30" x="60" y="30" fill="#FFA800"/><text x="200" y="51" fill="#181A24" font-family="'Courier New', monospace" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">CHAPTER 07 / TOOL ECOSYSTEM</text><text x="60" y="105" fill="#181A24" font-size="38" font-weight="900">软件导入指南：无缝连接主流间隔记忆神器</text><text x="60" y="138" fill="#FF4765" font-size="18" font-weight="700">全量词库采用通用标准化格式，1 分钟导入手机与桌面端随时随地刷词</text></g><g id="software-cards-zone" data-pptx-bounds="60 165 1160 395"><g id="tool-anki"><rect width="360" height="380" x="64" y="174" fill="#006B7B"/><rect width="360" height="380" x="60" y="170" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="360" height="60" x="60" y="170" fill="#006B7B"/><text x="240" y="208" fill="#FAF6EE" font-size="22" font-weight="900" text-anchor="middle">📱 导入 Anki (记忆曲线神器)</text><g fill="#475569" font-size="15"><text x="85" y="260" fill="#181A24" font-weight="900">操作极简步骤：</text><text x="85" y="290">1. 将 Excel 词库另存为</text><text x="105" y="315" fill="#006B7B" font-weight="700">CSV (UTF-8 逗号分隔) (*.csv)</text><text x="85" y="345">2. 打开 Anki 点击「文件」➔「导入」</text><text x="85" y="375">3. 字段映射配置：</text><text x="105" y="400">• 字段 1 ➔ Front (正面/英文)</text><text x="105" y="425">• 字段 2 ➔ Phonetic (音标)</text><text x="105" y="450">• 字段 3 ➔ Back (背面/释义)</text></g><rect width="310" height="45" x="85" y="480" fill="#E1F2F5" stroke="#006B7B" stroke-width="1.5"/><text x="240" y="508" fill="#006B7B" font-size="15" font-weight="900" text-anchor="middle">★ 艾宾浩斯间隔复习，抗遗忘利器</text></g><g id="tool-quizlet"><rect width="360" height="380" x="464" y="174" fill="#FF4765"/><rect width="360" height="380" x="460" y="170" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="360" height="60" x="460" y="170" fill="#FF4765"/><text x="640" y="208" fill="#FAF6EE" font-size="22" font-weight="900" text-anchor="middle">📝 导入 Quizlet (卡片快刷)</text><g fill="#475569" font-size="15"><text x="485" y="260" fill="#181A24" font-weight="900">操作极简步骤：</text><text x="485" y="290">1. 登录 Quizlet 点击「创建」➔「学习集」</text><text x="485" y="320">2. 点击卡片下方「从表格/Excel导入」</text><text x="485" y="350">3. 在 Excel 词库中复制两列：</text><text x="505" y="375" fill="#FF4765" font-weight="700">「单词」与「释义」</text><text x="485" y="405">4. 粘贴至文本框，分隔符选「制表符」</text><text x="485" y="435">5. 点击「导入」并保存学习集即可</text></g><rect width="310" height="45" x="485" y="480" fill="#FFE8EC" stroke="#FF4765" stroke-width="1.5"/><text x="640" y="508" fill="#FF4765" font-size="15" font-weight="900" text-anchor="middle">★ 手机端随时随地划词与拼写自测</text></g><g id="tool-eudic"><rect width="360" height="380" x="864" y="174" fill="#181A24"/><rect width="360" height="380" x="860" y="170" fill="#FFF" stroke="#181A24" stroke-width="3"/><rect width="360" height="60" x="860" y="170" fill="#181A24"/><text x="1040" y="208" fill="#FFA800" font-size="22" font-weight="900" text-anchor="middle">📖 欧路 / 有道 / 扇贝</text><g fill="#475569" font-size="15"><text x="885" y="260" fill="#181A24" font-weight="900">各词典软件原生直导：</text><text x="885" y="290">1. <tspan fill="#181A24" font-weight="700">欧路词典 (Eudic)</tspan>：</text><text x="905" y="315">进入「生词本」➔「管理」➔「导入生词」</text><text x="905" y="338">原生直接解析 Excel 格式，一秒载入！</text><text x="885" y="375">2. <tspan fill="#181A24" font-weight="700">有道词典 / 扇贝单词</tspan>：</text><text x="905" y="400">将生词导出为单列 .txt 纯文本</text><text x="905" y="425">桌面端一键导入生词本，多端自动同步</text></g><rect width="310" height="45" x="885" y="480" fill="#FFF4D9" stroke="#181A24" stroke-width="1.5"/><text x="1040" y="508" fill="#181A24" font-size="15" font-weight="900" text-anchor="middle">★ 多端无缝同步，随时查词复习</text></g></g><g id="data-schema-zone" data-pptx-bounds="60 570 1160 105"><rect width="1160" height="95" x="60" y="575" fill="#181A24" stroke="#181A24" stroke-width="2"/><text x="90" y="610" fill="#FFA800" font-size="18" font-weight="900">📋 词库统一数据规范标准 (Data Schema)：</text><g fill="#FAF6EE" font-family="'Courier New', monospace" font-size="14"><text x="90" y="642">[Word: String] resilience • [Phonetic: IPA] /rɪˈzɪliəns/ • [Definition: String] n. 恢复力；弹力；适应力</text></g><rect width="150" height="55" x="1040" y="595" fill="#FF4765"/><text x="1115" y="628" fill="#FAF6EE" font-size="15" font-weight="900" text-anchor="middle">100% 格式无错</text></g></svg>