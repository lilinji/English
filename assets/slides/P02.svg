<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" data-pptx-page-role="content" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif" lang="zh-CN" viewBox="0 0 1280 720"><defs><pattern id="halftone-pink" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#FF4765" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#FF4765" fill-opacity=".3"/></pattern><pattern id="halftone-teal" width="12" height="12" data-pptx-bg="#FAF6EE" data-pptx-fg="#006B7B" data-pptx-pattern="dotGrid" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#006B7B" fill-opacity=".25"/></pattern></defs><rect id="bg" width="1280" height="720" fill="#FAF6EE" data-pptx-role="background"/><g id="header-zone" data-pptx-bounds="40 25 1200 130"><rect width="220" height="30" x="60" y="30" fill="#FF4765"/><text x="170" y="51" fill="#FAF6EE" font-family="'Courier New', monospace" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">CHAPTER 01 / ORIGIN</text><text x="60" y="105" fill="#181A24" font-size="38" font-weight="900">告别碎片与套路：构建数字化词汇新基建</text><text x="60" y="138" fill="#006B7B" font-size="18" font-weight="700">为什么我们需要一个统一规范、真正完整且开箱即用的开源词库？</text></g><g id="body-comparison-zone" data-pptx-bounds="60 165 1160 515"><g id="left-pain-points"><rect width="550" height="490" x="64" y="174" fill="#181A24"/><rect width="550" height="490" x="60" y="170" fill="#FFE8EC" stroke="#181A24" stroke-width="3"/><rect width="300" height="40" x="90" y="195" fill="#FF4765" stroke="#181A24" stroke-width="2"/><text x="240" y="222" fill="#FAF6EE" font-size="18" font-weight="900" text-anchor="middle">⚠️ 传统网络生词本的三大泥潭</text><g id="pain-item-1"><circle cx="105" cy="275" r="16" fill="#181A24"/><text x="105" y="281" fill="#FFE8EC" font-size="16" font-weight="900" text-anchor="middle">1</text><text x="135" y="272" fill="#181A24" font-size="20" font-weight="900">格式残缺与乱码连篇</text><text x="135" y="300" fill="#5A6072" font-size="15">音标字符集未标准化，导入手机词典后满屏方框与问号乱码； <tspan x="135" dy="22">排版错列错行，严重破坏背词心流与学习节奏。</tspan></text></g><g id="pain-item-2"><circle cx="105" cy="375" r="16" fill="#181A24"/><text x="105" y="381" fill="#FFE8EC" font-size="16" font-weight="900" text-anchor="middle">2</text><text x="135" y="372" fill="#181A24" font-size="20" font-weight="900">死板正序引发“abandon 综合征”</text><text x="135" y="400" fill="#5A6072" font-size="15">只有 A-Z 机械正序，产生强烈的首字母记忆依赖与审美疲劳； <tspan x="135" dy="22">背到 C 就放弃，无法在真实语境与考试中实现瞬时唤醒。</tspan></text></g><g id="pain-item-3"><circle cx="105" cy="475" r="16" fill="#181A24"/><text x="105" y="481" fill="#FFE8EC" font-size="16" font-weight="900" text-anchor="middle">3</text><text x="135" y="472" fill="#181A24" font-size="20" font-weight="900">商业机构套路截流与私有壁垒</text><text x="135" y="500" fill="#5A6072" font-size="15">给半本词库设卡收费，或使用私有加密数据包强制绑定 App； <tspan x="135" dy="22">学习者花费数小时找资源，往往落入营销群与付费圈套。</tspan></text></g><line x1="90" x2="570" y1="570" y2="570" stroke="#FF4765" stroke-dasharray="6 4" stroke-width="2"/><text x="330" y="615" fill="#FF4765" font-size="17" font-weight="900" text-anchor="middle">“找词书 2 小时，排版 1 小时，实际背词 10 分钟”</text></g><g id="right-solutions"><rect width="556" height="490" x="664" y="174" fill="#FF4765"/><rect width="556" height="490" x="660" y="170" fill="#E1F2F5" stroke="#181A24" stroke-width="3"/><rect width="340" height="40" x="690" y="195" fill="#006B7B" stroke="#181A24" stroke-width="2"/><text x="860" y="222" fill="#FAF6EE" font-size="18" font-weight="900" text-anchor="middle">✨ VOCABULARY VAULT 的破局之道</text><g id="solution-item-1"><rect width="32" height="32" x="690" y="260" fill="#006B7B"/><text x="706" y="282" fill="#FAF6EE" font-size="18" font-weight="900" text-anchor="middle">✓</text><text x="735" y="272" fill="#181A24" font-size="20" font-weight="900">极致完整：960+ 权威词书全景收录</text><text x="735" y="300" fill="#334155" font-size="15">覆盖全国中小学教材、四六级、专八、考研、雅思、托福、IT专业， <tspan x="735" dy="22">可能是全网分类最详尽、覆盖学段最广泛的词汇总母本。</tspan></text></g><g id="solution-item-2"><rect width="32" height="32" x="690" y="360" fill="#006B7B"/><text x="706" y="382" fill="#FAF6EE" font-size="18" font-weight="900" text-anchor="middle">✓</text><text x="735" y="372" fill="#181A24" font-size="20" font-weight="900">严苛标准化：规范 IPA 音标 + Excel/TXT</text><text x="735" y="400" fill="#334155" font-size="15">全库统一采用国际标准音标字符集，权威释义，严防乱码； <tspan x="735" dy="22">重点词书同步提供正序与乱序双版本，彻底打破位置记忆依赖。</tspan></text></g><g id="solution-item-3"><rect width="32" height="32" x="690" y="460" fill="#006B7B"/><text x="706" y="482" fill="#FAF6EE" font-size="18" font-weight="900" text-anchor="middle">✓</text><text x="735" y="472" fill="#181A24" font-size="20" font-weight="900">真正纯粹开源：零门槛直导主流神器</text><text x="735" y="500" fill="#334155" font-size="15">直导 Anki、Quizlet、欧路词典，永久免费且无任何商业套路； <tspan x="735" dy="22">更附带 108 篇新概念英语名师讲义深度精析，超越单纯生词本！</tspan></text></g><line x1="690" x2="1170" y1="570" y2="570" stroke="#006B7B" stroke-dasharray="6 4" stroke-width="2"/><text x="930" y="615" fill="#006B7B" font-size="17" font-weight="900" text-anchor="middle">“一次下载，终身受用；让学习者聚焦于记忆本身”</text></g></g></svg>